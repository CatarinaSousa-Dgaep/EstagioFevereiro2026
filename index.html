<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia de Estágio Power BI</title>
<style>
:root {
  --bg: #F4F6FB;
  --bg2: #FFFFFF;
  --bg3: #EDF0F7;
  --text: #23243A;
  --text2: #555770;
  --primary: #563D7C;
  --primary-light: #7C5FAF;
  --secondary: #0078D7;
  --accent: #9B59B6;
  --gradient: linear-gradient(135deg, #563D7C 0%, #0078D7 100%);
  --gradient2: linear-gradient(135deg, #9B59B6 0%, #0078D7 100%);
  --shadow: 0 2px 16px rgba(86,61,124,0.08);
  --shadow2: 0 4px 24px rgba(86,61,124,0.13);
  --radius: 14px;
  --radius-sm: 8px;
  --sidebar-w: 260px;
  --success: #27AE60;
  --warning: #F39C12;
  --danger: #E74C3C;
  --info: #3498DB;
  --border: #E0E3EB;
  --transition: 0.28s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #14151F;
  --bg2: #1E1E2F;
  --bg3: #262840;
  --text: #E0E2EE;
  --text2: #A0A3BA;
  --border: #33354A;
  --shadow: 0 2px 16px rgba(0,0,0,0.25);
  --shadow2: 0 4px 24px rgba(0,0,0,0.35);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
a { color: var(--secondary); text-decoration: none; }
a:hover { text-decoration: underline; }
/* Toast */
#toast-container {
  position: fixed; top: 24px; right: 24px; z-index: 10000;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--bg2);
  color: var(--text);
  border-left: 5px solid var(--primary);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow2);
  padding: 14px 22px;
  font-size: 0.97rem;
  opacity: 0;
  transform: translateX(80px);
  transition: opacity 0.35s, transform 0.35s;
  max-width: 370px;
  display: flex; align-items: center; gap: 10px;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast.success { border-left-color: var(--success); }
.toast.warning { border-left-color: var(--warning); }
.toast.danger { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }
.toast-icon { font-size: 1.3rem; }
/* Sidebar */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 1000;
  display: flex; flex-direction: column;
  transition: transform var(--transition), background var(--transition);
  overflow-y: auto;
}
.sidebar-header {
  padding: 28px 22px 12px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  width: 42px; height: 42px;
  background: var(--gradient);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; color: #fff;
}
.sidebar-title {
  font-size: 1.1rem; font-weight: 700; color: var(--text);
  line-height: 1.2;
}
.sidebar-title small { font-weight: 400; font-size: 0.78rem; color: var(--text2); display: block; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.sidebar-nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 24px;
  cursor: pointer;
  color: var(--text2);
  font-size: 0.98rem;
  font-weight: 500;
  border-radius: 0 var(--radius) var(--radius) 0;
  margin: 2px 8px 2px 0;
  transition: background var(--transition), color var(--transition), transform 0.15s;
  user-select: none;
}
.sidebar-nav-item:hover { background: var(--bg3); color: var(--text); }
.sidebar-nav-item.active {
  background: var(--gradient);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 2px 12px rgba(86,61,124,0.18);
}
.sidebar-nav-icon { font-size: 1.28rem; width: 28px; text-align: center; }
.sidebar-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--border);
  font-size: 0.8rem;
  color: var(--text2);
  text-align: center;
}
/* Hamburger */
.hamburger {
  display: none;
  position: fixed; top: 14px; left: 14px; z-index: 1100;
  background: var(--gradient);
  color: #fff;
  border: none; border-radius: 10px;
  width: 44px; height: 44px;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  align-items: center; justify-content: center;
  transition: background var(--transition);
}
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 999;
}
.overlay.show { display: block; }
/* Main */
.main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  padding: 36px 36px 60px;
  transition: margin-left var(--transition);
}
.main-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.main-header-title { font-size: 1.55rem; font-weight: 700; }
.theme-toggle {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 1.15rem;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
  transition: background var(--transition);
}
.theme-toggle:hover { background: var(--primary-light); color: #fff; }
/* Cards */
.cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 20px;
  margin-bottom: 28px;
}
.card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 20px;
  transition: box-shadow var(--transition), transform 0.18s, background var(--transition);
  position: relative;
  overflow: hidden;
}
.card:hover { box-shadow: var(--shadow2); transform: translateY(-2px); }
.card-icon { font-size: 2rem; margin-bottom: 8px; }
.card-label { font-size: 0.88rem; color: var(--text2); margin-bottom: 2px; }
.card-value { font-size: 1.65rem; font-weight: 700; color: var(--text); }
.card-bar { height: 6px; border-radius: 3px; background: var(--bg3); margin-top: 10px; }
.card-bar-inner {
  height: 100%; border-radius: 3px;
  background: var(--gradient);
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}
/* Progress Bar */
.progress-section { margin-bottom: 28px; }
.progress-bar-outer {
  background: var(--bg3);
  border-radius: 12px;
  height: 22px;
  overflow: hidden;
  margin-top: 8px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.06);
}
.progress-bar-inner {
  height: 100%;
  background: var(--gradient2);
  border-radius: 12px;
  transition: width 0.7s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 10px; color: #fff; font-size: 0.82rem; font-weight: 700;
  min-width: 32px;
}
/* Quick Actions */
.quick-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
.quick-btn {
  background: var(--gradient);
  color: #fff;
  border: none; border-radius: 50px;
  padding: 10px 22px;
  font-size: 0.95rem;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(86,61,124,0.12);
  transition: transform 0.15s, box-shadow 0.2s;
}
.quick-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow2); }
/* Activity Feed */
.activity-feed { margin-top: 10px; }
.activity-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.95rem;
}
.activity-item:last-child { border-bottom: none; }
.activity-dot {
  min-width: 10px; min-height: 10px;
  border-radius: 50%;
  margin-top: 6px;
}
.activity-dot.green { background: var(--success); }
.activity-dot.blue { background: var(--info); }
.activity-dot.purple { background: var(--accent); }
.activity-dot.orange { background: var(--warning); }
.activity-time { color: var(--text2); font-size: 0.82rem; margin-top: 2px; }
/* Section Title */
.section-title {
  font-size: 1.35rem; font-weight: 700; margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
/* Modules */
.module-card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow var(--transition), background var(--transition);
}
.module-card:hover { box-shadow: var(--shadow2); }
.module-header {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 22px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.module-header:hover { background: var(--bg3); }
.module-num {
  width: 38px; height: 38px;
  background: var(--gradient);
  color: #fff;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem;
  flex-shrink: 0;
}
.module-info { flex: 1; }
.module-name { font-weight: 700; font-size: 1.05rem; }
.module-meta { display: flex; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
.module-meta span { font-size: 0.82rem; color: var(--text2); }
.module-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 50px;
  font-size: 0.76rem;
  font-weight: 600;
  color: #fff;
}
.badge-beginner { background: var(--success); }
.badge-intermediate { background: var(--warning); }
.badge-advanced { background: var(--danger); }
.module-check {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
  font-size: 1rem;
}
.module-check.checked {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.module-expand-icon { font-size: 1.2rem; color: var(--text2); transition: transform 0.25s; flex-shrink: 0; }
.module-expand-icon.open { transform: rotate(180deg); }
.module-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s cubic-bezier(.4,0,.2,1), padding 0.3s;
  padding: 0 22px;
  background: var(--bg3);
  font-size: 0.96rem;
  color: var(--text2);
  line-height: 1.7;
}
.module-body.open { max-height: 800px; padding: 18px 22px; }
.module-body h4 { color: var(--text); margin: 10px 0 4px; font-size: 1rem; }
.module-body ul { margin: 4px 0 8px 18px; }
.module-body li { margin-bottom: 3px; }
/* Worksheets */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; align-items: center;
}
.filter-bar select, .filter-bar input {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); }
.worksheet-card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 22px;
  margin-bottom: 12px;
  display: flex; align-items: flex-start; gap: 14px;
  transition: box-shadow var(--transition), background var(--transition);
}
.worksheet-card:hover { box-shadow: var(--shadow2); }
.ws-check {
  width: 24px; height: 24px; min-width: 24px;
  border-radius: 6px;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  margin-top: 2px;
  transition: background 0.2s, border-color 0.2s;
  font-size: 0.95rem;
}
.ws-check.checked { background: var(--success); border-color: var(--success); color: #fff; }
.ws-title { font-weight: 700; font-size: 1rem; }
.ws-desc { color: var(--text2); font-size: 0.92rem; margin-top: 2px; }
/* Logbook */
.log-form {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.log-form .full { grid-column: 1 / -1; }
.log-form label { font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; display: block; color: var(--text2); }
.log-form input, .log-form textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  resize: vertical;
  font-family: inherit;
  transition: border-color 0.2s;
}
.log-form input:focus, .log-form textarea:focus { border-color: var(--primary); }
.log-form textarea { min-height: 60px; }
.btn-primary {
  background: var(--gradient);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 28px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(86,61,124,0.12);
  transition: transform 0.15s, box-shadow 0.2s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
.log-total {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 22px;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px; font-size: 1.05rem;
}
.log-total strong { color: var(--primary); font-size: 1.3rem; }
.log-entry {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 22px;
  margin-bottom: 10px;
  transition: background var(--transition);
}
.log-entry-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.log-entry-date { font-weight: 700; color: var(--primary); }
.log-entry-hours { font-size: 0.88rem; color: var(--text2); }
.btn-delete {
  background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.15rem; padding: 4px; border-radius: 6px;
  transition: background 0.15s;
}
.btn-delete:hover { background: rgba(231,76,60,0.1); }
.log-entry p { margin-top: 6px; font-size: 0.93rem; color: var(--text2); }
.log-entry p strong { color: var(--text); }
/* Skills */
.skill-row {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 18px;
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 22px;
}
.skill-label { width: 140px; font-weight: 600; font-size: 0.97rem; flex-shrink: 0; }
.skill-slider { flex: 1; }
.skill-slider input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px;
  border-radius: 4px;
  background: var(--bg3);
  outline: none;
  transition: background 0.2s;
}
.skill-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gradient);
  cursor: pointer;
  box-shadow: 0 1px 6px rgba(86,61,124,0.2);
}
.skill-slider input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gradient);
  cursor: pointer;
  border: none;
}
.skill-value { width: 48px; text-align: right; font-weight: 700; font-size: 1.05rem; color: var(--primary); }
.radar-container {
  display: flex; justify-content: center; align-items: center;
  margin: 30px 0 10px;
}
.radar-svg { max-width: 370px; width: 100%; }
.radar-svg text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
/* Assessment */
.quiz-card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 18px;
}
.quiz-q { font-weight: 700; font-size: 1.05rem; margin-bottom: 12px; }
.quiz-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-size: 0.96rem;
}
.quiz-option:hover { border-color: var(--primary-light); background: var(--bg3); }
.quiz-option.selected { border-color: var(--primary); background: rgba(86,61,124,0.08); }
.quiz-option.correct { border-color: var(--success); background: rgba(39,174,96,0.10); }
.quiz-option.wrong { border-color: var(--danger); background: rgba(231,76,60,0.08); }
.quiz-radio {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.2s, background 0.2s;
}
.quiz-option.selected .quiz-radio { border-color: var(--primary); background: var(--primary); }
.quiz-option.selected .quiz-radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.quiz-result {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow2);
  padding: 36px;
  text-align: center;
}
.quiz-score { font-size: 3rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.quiz-msg { font-size: 1.1rem; margin: 10px 0 18px; color: var(--text2); }
/* Resources */
.resource-group { margin-bottom: 24px; }
.resource-group-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.resource-card {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 20px;
  margin-bottom: 10px;
  transition: box-shadow var(--transition);
}
.resource-card:hover { box-shadow: var(--shadow2); }
.resource-title { font-weight: 700; font-size: 1rem; }
.resource-desc { font-size: 0.91rem; color: var(--text2); margin-top: 3px; }
.resource-badge {
  display: inline-block; padding: 2px 10px; border-radius: 50px;
  font-size: 0.76rem; font-weight: 600; color: #fff; margin-top: 6px;
}
.rb-doc { background: var(--info); }
.rb-yt { background: #E74C3C; }
.rb-comm { background: var(--success); }
.rb-book { background: var(--accent); }
.rb-tool { background: var(--warning); }
/* Settings */
.settings-group {
  background: var(--bg2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 18px;
}
.settings-group h3 { font-size: 1.05rem; margin-bottom: 12px; }
.settings-row {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.settings-row label { font-weight: 600; font-size: 0.95rem; min-width: 120px; }
.settings-row input[type="text"], .settings-row input[type="file"] {
  padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none; flex: 1; min-width: 180px;
  font-family: inherit;
}
.settings-row input:focus { border-color: var(--primary); }
.btn-secondary {
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 20px; font-size: 0.95rem; cursor: pointer;
  font-weight: 600; transition: background 0.15s;
}
.btn-secondary:hover { background: var(--primary-light); color: #fff; border-color: var(--primary-light); }
.btn-danger {
  background: var(--danger); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 10px 22px; font-size: 0.95rem; cursor: pointer;
  font-weight: 600; transition: background 0.15s;
}
.btn-danger:hover { background: #C0392B; }
/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--bg2); border-radius: var(--radius); box-shadow: var(--shadow2);
  padding: 32px; max-width: 420px; width: 92%; text-align: center;
}
.modal-box h3 { margin-bottom: 10px; font-size: 1.15rem; }
.modal-box p { color: var(--text2); margin-bottom: 18px; font-size: 0.97rem; }
.modal-btns { display: flex; gap: 12px; justify-content: center; }
/* Section visibility */
.section { display: none; animation: fadeIn 0.35s; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
/* Responsive */
@media (max-width: 800px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: flex; }
  .main { margin-left: 0; padding: 70px 16px 40px; }
  .cards-row { grid-template-columns: 1fr 1fr; }
  .log-form { grid-template-columns: 1fr; }
  .skill-row { flex-wrap: wrap; }

  function loadState() {

  }
  function saveState(s) { localStorage.setItem('pbi_guide_state', JSON.stringify(s)); }
  let state = loadState();
  function getDefault(key, def) { return state[key] !== undefined ? state[key] : def; }
  function setState(key, val) { state[key] = val; saveState(state); }
  /* ===== TOAST ===== */
  function toast(msg, type) {
    type = type || 'info';
    var icons = { success: '✅', warning: '⚠️', danger: '❌', info: 'ℹ️' };
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = '<span class="toast-icon">' + (icons[type]||'ℹ️') + '</span><span>' + msg + '</span>';
    c.appendChild(t);
    requestAnimationFrame(function() { t.classList.add('show'); });
    setTimeout(function() {
      t.classList.remove('show');
      setTimeout(function() { if(t.parentNode) t.parentNode.removeChild(t); }, 400);
    }, 3000);
  }
  /* ===== MODAL ===== */
  function showModal(title, message, onConfirm) {

    ov.classList.add('show');
    document.getElementById('modal-cancel').onclick = function() { ov.classList.remove('show'); };
    document.getElementById('modal-confirm').onclick = function() { ov.classList.remove('show'); if(onConfirm) onConfirm(); };
  }

  function getModulesCompleted() {

    MODULES.forEach(function(m) { if(mc[m.id]) c++; });
    return c;
  }
  function getTotalHours() {
    var entries = getDefault('logEntries', []);
    var t = 0;
    entries.forEach(function(e) { t += parseFloat(e.hours) || 0; });
    return t;
  }
  function getSkillsAvg() {
    var skills = getDefault('skills', {});
    var total = 0, count = 0;
    SKILLS_LIST.forEach(function(s) { total += (skills[s.id] || 0); count++; });
    return count ? Math.round(total / count) : 0;
  }

    var modPct = (getModulesCompleted() / MODULES.length) * 100;
