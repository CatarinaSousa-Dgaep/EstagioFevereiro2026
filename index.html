<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guião de Estágio — Power BI 2026</title>
<style>
:root{--p:#0078B4;--pl:#1FBBD7;--s:#4AA1A1;--ok:#28A745;--warn:#F7B267;--err:#E03E36;--bg:#F5F7FA;--card:#FFF;--side:#F0F4F8;--tx:#1a1a2e;--tx2:#666;--bd:#e0e0e0;--sh:0 2px 10px rgba(0,0,0,.07);--r:10px;--sw:260px;--f:'Segoe UI',system-ui,sans-serif;--tr:.3s ease}
[data-theme=dark]{--bg:#0f0f1a;--card:#1a1a2e;--side:#12121f;--tx:#e0e0e0;--tx2:#999;--bd:#2a2a3e;--sh:0 2px 10px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--tx);line-height:1.65;transition:background var(--tr),color var(--tr)}
a{color:var(--p)}
.sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--side);border-right:1px solid var(--bd);overflow-y:auto;z-index:1000;transition:transform var(--tr),background var(--tr);display:flex;flex-direction:column}
.side-hdr{padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.side-hdr h2{font-size:15px;color:var(--p);display:flex;align-items:center;gap:6px}
.side-close{display:none;background:none;border:none;font-size:22px;color:var(--tx);cursor:pointer}
.side-nav{flex:1;padding:6px 0}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;font-size:13.5px;color:var(--tx);transition:all .2s}
.nav-i:hover{background:rgba(0,120,180,.07)}
.nav-i.act{border-left-color:var(--p);background:rgba(0,120,180,.1);color:var(--p);font-weight:600}
.nav-i .ic{width:20px;text-align:center}
.nav-i .badge{margin-left:auto;font-size:10px;background:var(--bd);border-radius:10px;padding:1px 7px;color:var(--tx2)}
.side-ft{padding:10px 16px;border-top:1px solid var(--bd);font-size:10px;color:var(--tx2);text-align:center}
.main{margin-left:var(--sw);min-height:100vh;transition:margin var(--tr)}
.hdr{position:sticky;top:0;z-index:500;background:var(--card);border-bottom:1px solid var(--bd);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;transition:background var(--tr)}
.hdr-l{display:flex;align-items:center;gap:10px}
.menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx)}
.hdr-t{font-size:16px;font-weight:600}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:12px;font-family:var(--f);transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn-p{background:var(--p);color:#fff;border-color:var(--p)}
.btn-p:hover{background:#006699;color:#fff}
.btn-d{background:var(--err);color:#fff;border-color:var(--err)}
.btn-d:hover{background:#c0302a}
.save-status{font-size:11px;color:var(--ok);display:flex;align-items:center;gap:4px;min-width:180px;justify-content:flex-end}
.content{padding:20px;max-width:960px}
.sect{display:none}
.sect.act{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.dc{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:transform .2s}
.dc:hover{transform:translateY(-2px)}
.dc .dl{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.dc .dv{font-size:26px;font-weight:700;color:var(--p)}
.dc .ds{font-size:11px;color:var(--tx2);margin-top:3px}
.pbar{width:100%;height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:8px}
.pbar-f{height:100%;background:linear-gradient(90deg,var(--p),var(--pl));border-radius:4px;transition:width .5s}
.ph-hdr{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-radius:var(--r);padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.ph-hdr::after{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%}
.ph-hdr .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:16px;padding:3px 12px;font-size:11px;margin-bottom:8px}
.ph-hdr h2{font-size:22px;margin-bottom:4px}
.ph-hdr p{opacity:.9;font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh);border:1px solid var(--bd);transition:background var(--tr),border var(--tr)}
.card h3{font-size:16px;margin-bottom:12px;color:var(--p);display:flex;align-items:center;gap:8px}
.card h4{font-size:14px;margin:14px 0 6px;color:var(--tx)}
.obj-i{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--bd)}
.obj-i:last-child{border-bottom:none}
.obj-i input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--p);cursor:pointer;flex-shrink:0}
.obj-i label{cursor:pointer;font-size:13.5px}
.obj-i.done label{text-decoration:line-through;color:var(--tx2)}
.exb{background:var(--bg);border-radius:var(--r);padding:18px;margin-bottom:14px;border-left:4px solid var(--pl)}
.exb h4{color:var(--pl);margin:0 0 10px}
.exb ol{padding-left:20px;font-size:13.5px}
.exb ol li{margin-bottom:6px}
.exb .tip{background:rgba(31,187,215,.1);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:12.5px;border-left:3px solid var(--pl)}
.exb .exp{margin-top:8px;font-size:12.5px;color:var(--tx2);font-style:italic}
.rub-t{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.rub-t th,.rub-t td{padding:8px 10px;border:1px solid var(--bd);text-align:left}
.rub-t th{background:var(--p);color:#fff;font-weight:600}
.rub-t tr:nth-child(even){background:rgba(0,0,0,.02)}
[data-theme=dark] .rub-t tr:nth-child(even){background:rgba(255,255,255,.02)}
.rub-t input[type=number]{width:55px;padding:4px;border:1px solid var(--bd);border-radius:4px;text-align:center;background:var(--bg);color:var(--tx);font-size:13px}
.grade-d{font-size:30px;font-weight:700;color:var(--p);text-align:center;padding:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--tx2)}
.fg input,.fg textarea,.fg select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:13.5px;transition:border .2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(0,120,180,.12)}
.fg textarea{min-height:70px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.wt-i{padding:5px 13px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-size:12px;transition:all .2s;color:var(--tx)}
.wt-i:hover{border-color:var(--p)}
.wt-i.act{background:var(--p);color:#fff;border-color:var(--p)}
.wt-i.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.stars{display:flex;gap:3px}
.star{font-size:22px;cursor:pointer;color:var(--bd);transition:color .2s}
.star.on{color:var(--warn)}
.star:hover{color:var(--warn)}
.de{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);border-left:4px solid var(--pl);position:relative}
.de .d-date{font-size:11px;color:var(--tx2)}
.de .d-title{font-size:15px;font-weight:600;margin:3px 0}
.de .d-desc{font-size:13px;color:var(--tx2)}
.de .d-mood{font-size:18px;position:absolute;top:12px;right:12px}
.de .d-tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.de .d-tag{background:rgba(0,120,180,.1);color:var(--p);padding:1px 8px;border-radius:10px;font-size:11px}
.de .d-del{position:absolute;bottom:10px;right:12px;background:none;border:none;color:var(--err);cursor:pointer;font-size:12px;opacity:.5}
.de .d-del:hover{opacity:1}
.emoji-p{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.emoji-o{font-size:22px;cursor:pointer;padding:3px;border-radius:6px;border:2px solid transparent;transition:all .2s}
.emoji-o:hover{background:rgba(0,0,0,.05)}
.emoji-o.sel{border-color:var(--p);background:rgba(0,120,180,.1)}
.comp-g{margin-bottom:20px}
.comp-g h4{color:var(--p);margin-bottom:10px;font-size:15px}
.comp-i{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.comp-i:last-child{border-bottom:none}
.comp-i input[type=checkbox]{width:17px;height:17px;accent-color:var(--p);cursor:pointer}
.comp-i label{flex:1;font-size:13px;cursor:pointer;min-width:150px}
.comp-i select{padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:12px}
.res-g{margin-bottom:18px}
.res-g h4{color:var(--p);margin-bottom:8px;font-size:15px}
.res-i{padding:6px 0;font-size:13.5px}
.res-i a{color:var(--pl);font-weight:500}
.search-box{margin-bottom:14px}
.search-box input{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .side-close{display:block}
  .main{margin-left:0}
  .menu-btn{display:block}
  .fr{grid-template-columns:1fr}
  .dash{grid-template-columns:1fr 1fr}
  .hdr-r .btn span{display:none}
}
@media print{
  .sidebar,.hdr,.btn,.menu-btn,.save-status,.emoji-p,.d-del,.search-box{display:none!important}
  .main{margin-left:0}
  .sect{display:block!important}
  .card,.dc{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="side-hdr">
    <h2>📊 Guião Power BI</h2>
    <button class="side-close" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="side-nav" id="sideNav"></div>
  <div class="side-ft">Estágio Power BI — Fev–Jun 2026<br>v2.0 · localStorage ativo</div>
</div>
<div class="main">
  <div class="hdr">
    <div class="hdr-l">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="hdr-t" id="hdrTitle">Dashboard</div>
    </div>
    <div class="hdr-r">
      <div class="save-status" id="saveStatus">✓ Pronto</div>
      <button class="btn" onclick="toggleTheme()">🌓 <span>Tema</span></button>
      <button class="btn" onclick="exportData()">📥 <span>Exportar</span></button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📤 <span>Importar</span></button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-d" onclick="clearAllData()">🗑 <span>Limpar</span></button>
    </div>
  </div>
  <div class="content" id="contentArea"></div>
</div>
<script>
// ===== DATA =====
const PHASES = [
  {id:'fase1',sem:'Semanas 1–2',title:'Introdução ao Power BI',desc:'Instalação, interface e primeiro relatório',
   objectives:['Compreender o ecossistema Power BI (Desktop, Service, Mobile)','Instalar e configurar o Power BI Desktop','Conhecer a interface: painéis Report, Data e Model','Identificar os tipos de conectores de dados','Criar o primeiro relatório simples com dados CSV'],
   theory:'O Power BI é uma plataforma de Business Intelligence da Microsoft que permite transformar dados em informações visuais interativas. O ecossistema inclui o Power BI Desktop (ferramenta de criação), o Power BI Service (plataforma cloud para partilha) e o Power BI Mobile (consulta em dispositivos móveis). A interface do Desktop divide-se em três vistas principais: Report View (onde se constroem as visualizações), Data View (para inspecionar tabelas) e Model View (para gerir relações entre tabelas). O Power BI suporta centenas de conectores, desde ficheiros Excel e CSV até bases de dados SQL, APIs REST e serviços cloud.',
   exercises:[
     {title:'Exercício 1: Instalar e Explorar a Interface',obj:'Instalar o Power BI Desktop e familiarizar-se com a interface.',steps:['Descarregar o Power BI Desktop em powerbi.microsoft.com','Instalar e abrir a aplicação','Explorar as 3 vistas: Report, Data e Model — clicar em cada ícone no painel esquerdo','Identificar os painéis: Visualizations, Filters e Fields','Aceder a File → Options para explorar as definições regionais','Configurar o idioma e formato de data para Português (Portugal)'],tip:'Ative a pré-visualização de funcionalidades em Options → Preview Features para experimentar novidades.',exp:'Deve conseguir navegar pelas 3 vistas e identificar todos os painéis principais.'},
     {title:'Exercício 2: Primeiro Relatório com Dados CSV',obj:'Criar um relatório simples de vendas a partir de um ficheiro CSV.',steps:['Criar um ficheiro CSV com colunas: Data, Produto, Região, Quantidade, PreçoUnitário (15-20 linhas de dados fictícios)','No Power BI, clicar em Get Data → Text/CSV e importar o ficheiro','Verificar na Data View se os tipos de dados foram detetados corretamente','Criar uma coluna calculada: Receita = Quantidade × PreçoUnitário','Na Report View, criar um gráfico de barras (Receita por Produto)','Adicionar um gráfico de linhas (Receita por Data)','Adicionar um cartão com o Total de Receita','Inserir um slicer (segmentação) por Região','Guardar o ficheiro como MeuPrimeiroRelatorio.pbix'],tip:'Experimente clicar nos visuais para ver o cross-filtering (filtragem cruzada) em ação.',exp:'Um relatório com 4 visuais interativos que filtram entre si.'}
   ],
   rubric:[['Instalação correta','Instalou e configurou sem erros',5],['Exploração da interface','Identifica vistas e painéis',5],['Relatório criado','Visuais corretos e funcionais',5],['Interatividade','Cross-filtering funciona',5]]
  },
  {id:'fase2',sem:'Semanas 3–4',title:'Power Query',desc:'Importação, limpeza e transformação de dados',
   objectives:['Compreender o papel do Power Query no pipeline de dados','Importar dados de múltiplas fontes (Excel, CSV, Web)','Aplicar transformações: renomear, filtrar, alterar tipos','Usar Merge Queries e Append Queries','Compreender e editar os passos aplicados (Applied Steps)'],
   theory:'O Power Query é o motor de ETL (Extract, Transform, Load) do Power BI. Permite importar dados de praticamente qualquer fonte, limpá-los e transformá-los antes de os carregar para o modelo. Todas as transformações são gravadas como passos (Applied Steps) que podem ser editados, reordenados ou eliminados. O Merge Queries funciona como um JOIN em SQL, permitindo combinar duas tabelas com base numa coluna comum. O Append Queries empilha tabelas com estrutura idêntica (como um UNION). As transformações são escritas em linguagem M nos bastidores, mas a interface gráfica permite fazer quase tudo sem código.',
   exercises:[
     {title:'Exercício 1: Importar e Limpar Dados com Erros',obj:'Praticar a limpeza de dados reais com problemas comuns.',steps:['Criar um ficheiro Excel com dados "sujos": espaços extra nos nomes, datas em formato texto, valores nulos, duplicados','Importar no Power BI via Get Data → Excel','Abrir o Power Query Editor (Transform Data)','Remover linhas em branco: Home → Remove Rows → Remove Blank Rows','Corrigir tipos de dados: selecionar colunas e definir tipos corretos','Usar Trim para remover espaços extra nas colunas de texto','Substituir valores nulos: Right-click → Replace Values','Remover duplicados: Right-click na coluna chave → Remove Duplicates','Renomear colunas para nomes padronizados (sem acentos, PascalCase)','Verificar o resultado e clicar Close & Apply'],tip:'Consulte sempre a barra de qualidade no topo de cada coluna — mostra a percentagem de valores válidos, com erro e vazios.',exp:'Uma tabela limpa, sem erros, duplicados ou espaços, com tipos de dados corretos.'},
     {title:'Exercício 2: Merge de Tabelas Clientes + Vendas',obj:'Combinar duas tabelas usando Merge Queries.',steps:['Criar duas tabelas Excel: Clientes (IDCliente, Nome, Cidade) e Vendas (IDVenda, IDCliente, Produto, Valor)','Importar ambas no Power BI','No Power Query, selecionar a tabela Vendas','Clicar em Home → Merge Queries','Selecionar IDCliente em ambas as tabelas','Escolher Left Outer Join (todas as linhas de Vendas)','Expandir a coluna resultante para trazer Nome e Cidade do cliente','Remover a coluna IDCliente duplicada','Reordenar as colunas logicamente','Close & Apply e verificar o resultado na Data View'],tip:'Experimente também o Append Queries: crie dois ficheiros de vendas (Jan e Fev) e junte-os numa única tabela.',exp:'Uma tabela de Vendas enriquecida com os dados do Cliente associado.'}
   ],
   rubric:[['Importação','Importa de múltiplas fontes sem erros',5],['Limpeza','Remove duplicados, corrige tipos, trata nulos',5],['Merge/Append','Combina tabelas corretamente',5],['Applied Steps','Compreende e explica os passos',5]]
  },
  {id:'fase3',sem:'Semanas 5–6',title:'Modelação de Dados',desc:'Star schema, relações e boas práticas',
   objectives:['Compreender os conceitos de modelação dimensional','Distinguir tabelas de facto e tabelas de dimensão','Criar um modelo em estrela (star schema)','Configurar relações entre tabelas (1:N, cardinalidade)','Compreender a direção do filtro (single vs. both)'],
   theory:'A modelação dimensional é a base de qualquer solução Power BI eficiente. O modelo em estrela (star schema) organiza os dados em tabelas de facto (contêm métricas numéricas e chaves estrangeiras) e tabelas de dimensão (contêm atributos descritivos). As relações entre tabelas definem como os filtros se propagam. Uma relação 1:N (um para muitos) é o tipo mais comum: o lado "1" é a dimensão e o lado "N" é o facto. A direção do filtro (single) propaga filtros da dimensão para o facto. Evite relações many-to-many e bidirecionais a menos que seja estritamente necessário, pois podem causar ambiguidade e problemas de desempenho.',
   exercises:[
     {title:'Exercício 1: Criar Modelo Estrela',obj:'Construir um modelo com 1 tabela facto e 3 dimensões.',steps:['Criar 4 tabelas em Excel: FactVendas (IDVenda, DataKey, ProdutoKey, LojaKey, Quantidade, Valor), DimData (DataKey, Data, Ano, Mês, Trimestre), DimProduto (ProdutoKey, Nome, Categoria, Preço), DimLoja (LojaKey, NomeLoja, Cidade, Região)','Importar todas no Power BI','Ir à Model View','Criar relação: FactVendas.DataKey → DimData.DataKey (1:N)','Criar relação: FactVendas.ProdutoKey → DimProduto.ProdutoKey (1:N)','Criar relação: FactVendas.LojaKey → DimLoja.LojaKey (1:N)','Verificar que todas as relações são Single direction','Organizar visualmente o modelo: facto ao centro, dimensões à volta','Ocultar as colunas Key da vista de relatório (Hide in Report View)'],tip:'Use nomes com prefixo: Fact para factos, Dim para dimensões. Facilita a identificação no modelo.',exp:'Um modelo estrela com 3 relações 1:N corretamente configuradas.'},
     {title:'Exercício 2: Testar o Modelo com Visuais',obj:'Validar que o modelo funciona corretamente com visualizações.',steps:['Ir à Report View','Criar uma Matrix: Linhas = DimProduto[Categoria], Colunas = DimData[Ano], Valores = Sum(FactVendas[Valor])','Verificar se os valores fazem sentido e os filtros propagam','Adicionar um Slicer com DimLoja[Região]','Confirmar que o slicer filtra a matrix corretamente','Criar um gráfico de barras: Vendas por Cidade (DimLoja[Cidade])','Testar o cross-filtering entre os visuais','Se algum filtro não funcionar, voltar ao Model View e verificar as relações'],tip:'Se um visual mostrar valores repetidos ou inflacionados, provavelmente há uma relação many-to-many indesejada.',exp:'Visuais que filtram corretamente entre si, validando a integridade do modelo.'}
   ],
   rubric:[['Estrutura','Modelo estrela correto com facto e dimensões',5],['Relações','Cardinalidade e direção corretas',5],['Boas práticas','Nomes claros, keys ocultas',5],['Validação','Modelo testado e funcional',5]]
  },
  {id:'fase4',sem:'Semanas 7–8',title:'DAX Básico',desc:'Medidas, colunas calculadas, CALCULATE e FILTER',
   objectives:['Distinguir medidas de colunas calculadas','Criar medidas com SUM, AVERAGE, COUNT, DISTINCTCOUNT','Compreender o contexto de avaliação (filter e row context)','Usar CALCULATE para modificar o contexto de filtro','Aplicar FILTER e ALL para filtros avançados'],
   theory:'DAX (Data Analysis Expressions) é a linguagem de fórmulas do Power BI. Existem dois tipos de cálculos: colunas calculadas (avaliadas linha a linha, armazenadas no modelo) e medidas (calculadas em tempo real com base no contexto). As medidas são preferíveis porque não ocupam memória. O contexto de avaliação é fundamental: o filter context é definido pelos filtros ativos (slicers, filtros de página, cross-filtering) e o row context existe dentro de colunas calculadas e funções iteradoras. CALCULATE é a função mais importante do DAX — modifica o filter context de uma expressão. ALL remove filtros, FILTER adiciona condições.',
   exercises:[
     {title:'Exercício 1: Criar Medidas Fundamentais',obj:'Criar as medidas mais comuns para análise de vendas.',steps:['Usando o modelo da Fase 3, criar as seguintes medidas na tabela FactVendas:','Total Vendas = SUM(FactVendas[Valor])','Quantidade Total = SUM(FactVendas[Quantidade])','Preço Médio = AVERAGE(FactVendas[Valor])','Nº Transações = COUNTROWS(FactVendas)','Nº Produtos Distintos = DISTINCTCOUNT(FactVendas[ProdutoKey])','Margem % = DIVIDE([Total Vendas] - SUM(FactVendas[Custo]), [Total Vendas], 0)','Ticket Médio = DIVIDE([Total Vendas], [Nº Transações])','Testar cada medida num Card visual','Verificar que os valores mudam com slicers ativos'],tip:'Use DIVIDE em vez de "/" para evitar erros de divisão por zero. DIVIDE aceita um valor alternativo como terceiro argumento.',exp:'7 medidas funcionais que respondem dinamicamente a filtros.'},
     {title:'Exercício 2: CALCULATE com Filtros de Contexto',obj:'Usar CALCULATE para criar medidas com contextos fixos.',steps:['Criar: Vendas 2025 = CALCULATE([Total Vendas], DimData[Ano] = 2025)','Criar: Vendas Lisboa = CALCULATE([Total Vendas], DimLoja[Cidade] = \"Lisboa\")','Criar: % do Total = DIVIDE([Total Vendas], CALCULATE([Total Vendas], ALL(DimProduto)))','Criar: Vendas Categoria A = CALCULATE([Total Vendas], DimProduto[Categoria] = \"A\")','Colocar todas as medidas numa tabela/matrix ao lado das medidas base','Aplicar um slicer de Região e observar quais medidas mudam e quais não','Criar: Top Vendas = CALCULATE([Total Vendas], FILTER(DimProduto, DimProduto[Preço] > 50))','Documentar o comportamento de cada medida face aos filtros'],tip:'CALCULATE com ALL remove o filtro daquela tabela — útil para calcular percentagens do total. Sem ALL, a medida responde ao contexto.',exp:'Medidas com contextos fixos e dinâmicos, compreendendo como CALCULATE modifica o filter context.'}
   ],
   rubric:[['Medidas básicas','SUM, AVERAGE, COUNT corretos',5],['CALCULATE','Usa corretamente com filtros',5],['Contexto','Explica filter vs row context',5],['FILTER/ALL','Aplica corretamente',5]]
  },
  {id:'fase5',sem:'Semanas 9–10',title:'DAX Avançado',desc:'Time Intelligence, RANKX, variáveis e otimização',
   objectives:['Criar medidas de Time Intelligence (YTD, QTD, YoY)','Configurar corretamente uma tabela de datas','Usar RANKX para rankings dinâmicos','Usar variáveis (VAR/RETURN) para clareza e desempenho','Aplicar SWITCH para lógica condicional','Compreender boas práticas de otimização DAX'],
   theory:'Time Intelligence requer uma tabela de datas contínua (sem falhas) marcada como Date Table. Funções como TOTALYTD, SAMEPERIODLASTYEAR e DATEADD permitem comparações temporais. RANKX cria rankings dinâmicos que respeitam o contexto de filtro. As variáveis (VAR/RETURN) melhoram a legibilidade e o desempenho ao evitar recalcular a mesma expressão múltiplas vezes. SWITCH é preferível a IF encadeados para lógica com múltiplas condições. Para otimização, evite colunas calculadas desnecessárias, use variáveis, e prefira medidas sobre colunas calculadas sempre que possível.',
   exercises:[
     {title:'Exercício 1: Time Intelligence — YTD e Comparação Anual',obj:'Criar medidas temporais avançadas.',steps:['Garantir que DimData tem datas contínuas (sem falhas) e marcar como Date Table','Criar: Vendas YTD = TOTALYTD([Total Vendas], DimData[Data])','Criar: Vendas QTD = TOTALQTD([Total Vendas], DimData[Data])','Criar: Vendas MTD = TOTALMTD([Total Vendas], DimData[Data])','Criar: Vendas Ano Anterior = CALCULATE([Total Vendas], SAMEPERIODLASTYEAR(DimData[Data]))','Criar: Crescimento YoY = VAR VendasAtual = [Total Vendas] VAR VendasAnterior = [Vendas Ano Anterior] RETURN DIVIDE(VendasAtual - VendasAnterior, VendasAnterior)','Criar: Vendas Mês Anterior = CALCULATE([Total Vendas], DATEADD(DimData[Data], -1, MONTH))','Testar todas num gráfico de linhas com eixo de Data','Formatar Crescimento YoY como percentagem'],tip:'Para marcar como Date Table: selecione a tabela, Table Tools → Mark as Date Table → selecione a coluna de data.',exp:'Medidas temporais que mostram evolução YTD, QTD, MTD e comparações com períodos anteriores.'},
     {title:'Exercício 2: Ranking Dinâmico com RANKX',obj:'Criar rankings que respondem a filtros.',steps:['Criar: Ranking Produto = RANKX(ALL(DimProduto[Nome]), [Total Vendas], , DESC, Dense)','Testar numa tabela: DimProduto[Nome], [Total Vendas], [Ranking Produto]','Aplicar um slicer de Região e verificar que o ranking recalcula','Criar: Top 5 Flag = IF([Ranking Produto] <= 5, \"Top 5\", \"Outros\")','Criar: Ranking com SWITCH = SWITCH(TRUE(), [Ranking Produto] = 1, \"🥇 Primeiro\", [Ranking Produto] = 2, \"🥈 Segundo\", [Ranking Produto] = 3, \"🥉 Terceiro\", \"Posição \" & [Ranking Produto])','Usar a medida Top 5 Flag como filtro visual para mostrar apenas o Top 5','Criar um gráfico de barras filtrado pelo Top 5'],tip:'Use ALLSELECTED em vez de ALL se quiser que o ranking respeite os slicers da página.',exp:'Rankings dinâmicos que recalculam conforme os filtros aplicados.'}
   ],
   rubric:[['Tabela de Datas','Configurada corretamente como Date Table',5],['Time Intelligence','YTD, YoY funcionais',5],['RANKX','Rankings dinâmicos corretos',5],['Variáveis/SWITCH','Código limpo e otimizado',5]]
  },
  {id:'fase6',sem:'Semanas 11–12',title:'Visualizações e Design',desc:'Boas práticas, acessibilidade e storytelling',
   objectives:['Aplicar princípios de design para dashboards eficazes','Escolher o tipo de visual adequado para cada cenário','Garantir acessibilidade (contraste, alt text, tab order)','Usar bookmarks e drillthrough para storytelling','Criar um layout consistente com tema personalizado'],
   theory:'Um bom dashboard conta uma história com dados. Os princípios fundamentais incluem: hierarquia visual (o mais importante em destaque), consistência (cores, fontes e espaçamentos uniformes), simplicidade (menos é mais — eliminar chartjunk), e acessibilidade. Escolher o visual certo é crucial: barras para comparação, linhas para tendências, mapas para geografia, KPIs para métricas-chave. Evite gráficos circulares com mais de 5 categorias. Use tooltips personalizados para dar contexto adicional. Bookmarks permitem criar estados de página para guiar o utilizador numa narrativa. O drillthrough permite navegar para páginas de detalhe mantendo o contexto de filtro.',
   exercises:[
     {title:'Exercício 1: Redesenhar Relatório com Boas Práticas',obj:'Aplicar regras de design a um relatório existente.',steps:['Pegar no relatório criado nas fases anteriores','Definir uma paleta de 5 cores consistente (usar coolors.co para inspiração)','Aplicar um tema personalizado: View → Themes → Customize current theme','Alinhar todos os visuais usando as guias (View → Snap to Grid)','Adicionar títulos claros e descritivos a cada visual','Configurar alt text em cada visual (Format → General → Alt Text)','Definir a tab order (View → Tab Order) para navegação por teclado','Remover bordas desnecessárias e reduzir o ruído visual','Usar espaçamento consistente (16px entre visuais)','Adicionar uma caixa de texto com título da página e data de atualização'],tip:'A regra dos 5 segundos: um utilizador deve compreender a mensagem principal do dashboard em 5 segundos.',exp:'Um relatório visualmente limpo, consistente, acessível e profissional.'},
     {title:'Exercício 2: Storytelling com Bookmarks e Drillthrough',obj:'Criar uma narrativa interativa com dados.',steps:['Criar 3 páginas no relatório: Resumo, Análise Detalhada, Detalhe Produto','Na página Resumo, criar uma visão geral com KPIs e gráficos principais','Configurar Drillthrough na página Detalhe Produto: arrastar DimProduto[Nome] para o well "Drill through"','Testar: right-click num produto → Drill through → Detalhe Produto','Na página Resumo, criar 2 versões: Visão Vendas e Visão Margem','Criar bookmarks para cada visão: View → Bookmarks → Add','Adicionar botões de navegação: Insert → Buttons → selecionar Action → Bookmark','Criar um tooltip personalizado: nova página tipo Tooltip (Page Size → Tooltip)','Associar o tooltip a um visual (Format → Tooltip → Page → selecionar a página)','Testar toda a navegação e storytelling de ponta a ponta'],tip:'Os bookmarks guardam o estado completo da página (filtros, visibilidade, scroll). Use Selection Pane para controlar o que cada bookmark mostra/esconde.',exp:'Um relatório com navegação por bookmarks, drillthrough funcional e tooltips personalizados.'}
   ],
   rubric:[['Design','Paleta consistente, alinhamento, limpeza',5],['Acessibilidade','Alt text, tab order, contraste',5],['Storytelling','Narrativa clara com bookmarks',5],['Drillthrough/Tooltips','Navegação funcional',5]]
  },
  {id:'fase7',sem:'Semanas 13–14',title:'Power BI Service',desc:'Publicação, dashboards, workspaces e RLS',
   objectives:['Publicar relatórios do Desktop para o Service','Criar dashboards com pins de múltiplos relatórios','Configurar workspaces e gerir permissões','Implementar Row-Level Security (RLS)','Configurar atualização agendada de dados'],
   theory:'O Power BI Service (app.powerbi.com) é a plataforma cloud onde se partilham e consomem relatórios. Um Workspace é um espaço colaborativo onde equipas publicam conteúdos. Dashboards são coleções de tiles (pins) de diferentes relatórios numa única página — são exclusivos do Service. O Row-Level Security (RLS) restringe o acesso a dados com base no utilizador autenticado, usando expressões DAX. A atualização agendada (Scheduled Refresh) permite que os dados se atualizem automaticamente. Para fontes on-premises é necessário o On-premises Data Gateway.',
   exercises:[
     {title:'Exercício 1: Publicar e Criar Dashboard',obj:'Publicar um relatório e criar um dashboard no Service.',steps:['No Power BI Desktop, clicar em Home → Publish','Selecionar o workspace de destino (My Workspace para teste)','Abrir o Power BI Service no navegador (app.powerbi.com)','Localizar o relatório publicado no workspace','Abrir o relatório e fazer pin de visuais-chave para um novo Dashboard','Clicar no ícone de pin (📌) em cada visual → selecionar "Novo dashboard"','Adicionar pelo menos 4 tiles ao dashboard','Reorganizar e redimensionar os tiles no dashboard','Configurar um alerta de dados: clicar nos "..." de um tile → Manage Alerts','Partilhar o dashboard com um colega (Share → introduzir email)'],tip:'Dashboards são ideais para executivos — mostram KPIs de múltiplos relatórios num só lugar. Relatórios são para análise detalhada.',exp:'Um dashboard funcional com tiles de diferentes visuais e um alerta configurado.'},
     {title:'Exercício 2: Configurar Row-Level Security (RLS)',obj:'Restringir dados por utilizador.',steps:['No Power BI Desktop, ir a Modeling → Manage Roles','Criar um role "Região Norte": adicionar filtro DimLoja[Região] = \"Norte\"','Criar um role "Região Sul": adicionar filtro DimLoja[Região] = \"Sul\"','Testar localmente: Modeling → View As → selecionar role "Região Norte"','Verificar que apenas os dados do Norte aparecem nos visuais','Voltar à vista normal (View As → desmarcar)','Publicar o relatório atualizado para o Service','No Service, ir ao dataset → Security','Adicionar os emails dos utilizadores a cada role','Testar usando "Test as role" no Service'],tip:'Para RLS dinâmico, use a função USERPRINCIPALNAME() no filtro: [Email] = USERPRINCIPALNAME(). Cada utilizador vê apenas os seus dados automaticamente.',exp:'RLS configurado e testado, com utilizadores a verem apenas os dados da sua região.'}
   ],
   rubric:[['Publicação','Publica corretamente para o Service',5],['Dashboard','Cria dashboard com tiles relevantes',5],['RLS','Roles configurados e testados',5],['Gestão','Workspace e permissões corretos',5]]
  },
  {id:'fase8',sem:'Semanas 15–16',title:'Projeto Final',desc:'Projeto integrador com dados reais',
   objectives:['Definir requisitos e âmbito do projeto','Aplicar todas as competências das fases anteriores','Criar uma solução Power BI completa de ponta a ponta','Documentar decisões técnicas e de design','Preparar para apresentação ao mentor/equipa'],
   theory:'O projeto final é a oportunidade de integrar tudo o que foi aprendido. Deve abordar um problema real ou simulado, desde a recolha de dados até à publicação do relatório. O processo inclui: levantamento de requisitos, identificação das fontes de dados, ETL no Power Query, modelação dimensional, criação de medidas DAX, design de relatório, e publicação no Service. A documentação deve incluir: diagrama do modelo, dicionário de dados, lista de medidas com fórmulas, decisões de design, e manual do utilizador.',
   exercises:[
     {title:'Exercício 1: Planeamento e Documentação',obj:'Planear o projeto antes de começar a construir.',steps:['Escolher um tema: vendas de loja, RH, finanças, logística, ou outro','Definir 3-5 perguntas de negócio que o relatório deve responder','Identificar as fontes de dados (mínimo 3 tabelas)','Desenhar o modelo estrela em papel ou ferramenta (draw.io)','Listar as medidas DAX necessárias para responder às perguntas','Esboçar o layout das páginas do relatório (wireframe)','Definir a paleta de cores e estilo visual','Criar um documento de requisitos com tudo o acima','Definir um cronograma para as 2 semanas (dividir em tarefas diárias)','Validar o plano com o mentor antes de avançar'],tip:'Um bom planeamento poupa horas de retrabalho. Invista 2-3 horas no plano antes de abrir o Power BI.',exp:'Um documento de requisitos completo com modelo, medidas, wireframes e cronograma.'},
     {title:'Exercício 2: Desenvolvimento da Solução Completa',obj:'Construir o projeto de ponta a ponta.',steps:['Importar os dados no Power Query e aplicar todas as transformações necessárias','Construir o modelo dimensional conforme planeado','Criar todas as medidas DAX (mínimo 10 medidas)','Incluir pelo menos 2 medidas de Time Intelligence','Desenhar o relatório com mínimo 3 páginas','Aplicar todas as boas práticas de design da Fase 6','Configurar drillthrough e bookmarks para storytelling','Implementar RLS se aplicável','Publicar no Power BI Service','Criar um dashboard de resumo no Service','Testar exaustivamente: filtros, navegação, dados, RLS','Documentar tudo num relatório técnico escrito'],tip:'Peça a alguém que nunca viu o relatório para o testar — o feedback de "olhos frescos" é sempre valioso.',exp:'Uma solução Power BI completa, publicada, testada e documentada.'}
   ],
   rubric:[['Planeamento','Requisitos claros e modelo documentado',5],['ETL','Power Query bem estruturado',5],['Modelo e DAX','Modelo correto, medidas completas',5],['Relatório','Design profissional, storytelling',5]]
  },
  {id:'fase9',sem:'Semana 17',title:'Apresentação e Avaliação',desc:'Apresentação final e avaliação de competências',
   objectives:['Preparar uma apresentação profissional do projeto','Demonstrar o relatório ao vivo','Responder a perguntas sobre decisões técnicas','Refletir sobre o percurso de aprendizagem','Identificar próximos passos de desenvolvimento'],
   theory:'A apresentação final é o culminar do estágio. Deve incluir: contexto do problema, abordagem técnica (modelo, DAX, ETL), demonstração ao vivo do relatório, decisões de design, desafios enfrentados e como foram superados, e conclusões. Estrutura recomendada: 5 min de contexto, 10 min de demonstração, 5 min de reflexão, 10 min de perguntas. Prepare-se para perguntas sobre alternativas técnicas e justificação de decisões.',
   exercises:[
     {title:'Exercício 1: Preparar a Apresentação',obj:'Criar uma apresentação profissional.',steps:['Criar uma apresentação PowerPoint com 10-15 slides','Slide 1: Título, nome, data','Slides 2-3: Contexto e perguntas de negócio','Slides 4-5: Fontes de dados e modelo dimensional','Slides 6-7: Medidas DAX principais (mostrar fórmulas)','Slides 8-10: Screenshots das páginas do relatório com anotações','Slide 11: Desafios enfrentados e soluções','Slide 12: O que aprendeu (reflexão pessoal)','Slide 13: Próximos passos e melhorias futuras','Slide 14: Demonstração ao vivo (link ou ficheiro)','Ensaiar a apresentação 2-3 vezes cronometrando o tempo'],tip:'A regra 10-20-30 de Guy Kawasaki: máximo 10 slides, 20 minutos, fonte mínima 30pt. Adapte para o seu contexto.',exp:'Uma apresentação profissional e ensaiada, pronta para o dia da avaliação.'},
     {title:'Exercício 2: Sessão de Apresentação e Feedback',obj:'Apresentar e receber avaliação final.',steps:['Apresentar o projeto ao mentor e/ou equipa (20-30 minutos)','Fazer a demonstração ao vivo do relatório no Power BI Service','Mostrar a interatividade: filtros, drillthrough, bookmarks','Explicar as decisões de modelação e DAX','Responder às perguntas do painel avaliador','Receber feedback construtivo','Preencher a auto-avaliação de competências (secção Competências deste guião)','Preencher a rubrica de avaliação final (secção Avaliação deste guião)','Identificar 3 áreas de melhoria para desenvolvimento futuro','Celebrar a conclusão do estágio! 🎉'],tip:'Durante a demonstração ao vivo, tenha um plano B (screenshots) caso haja problemas de rede ou do Service.',exp:'Apresentação concluída com sucesso, feedback recebido e avaliação final preenchida.'}
   ],
   rubric:[['Apresentação','Clara, estruturada, profissional',5],['Demonstração','Relatório funcional ao vivo',5],['Respostas','Justifica decisões técnicas',5],['Reflexão','Identifica aprendizagens e melhorias',5]]
  }
];

function lsGet(k, def=null){try{const v=localStorage.getItem(LS_KEY+k);return v
