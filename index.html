<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guião de Estágio Power BI — 2026</title>
<style>
:root {
  --primary: #007B9E;
  --primary-light: #1FBBD7;
  --secondary: #4AA1A1;
  --accent: #1FBBD7;
  --success: #28A745;
  --warning: #F7B267;
  --error: #E03E36;
  --bg: #FAFAFA;
  --bg-card: #FFFFFF;
  --bg-sidebar: #F0F4F8;
  --text: #1a1a2e;
  --text-secondary: #555;
  --border: #e0e0e0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --sidebar-width: 280px;
  --header-height: 60px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition: 0.3s ease;
}
[data-theme="dark"] {
  --bg: #121212;
  --bg-card: #1e1e2e;
  --bg-sidebar: #161625;
  --text: #e0e0e0;
  --text-secondary: #aaa;
  --border: #333;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background var(--transition), color var(--transition);
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* SIDEBAR */
.sidebar {
  position: fixed; top: 0; left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 1000;
  transition: transform var(--transition), background var(--transition);
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header h2 {
  font-size: 16px; color: var(--primary);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-close {
  display: none; background: none; border: none;
  font-size: 22px; color: var(--text); cursor: pointer;
}
.sidebar-nav { flex: 1; padding: 8px 0; }
.sidebar-nav .nav-group { margin-bottom: 4px; }
.sidebar-nav .nav-group-title {
  padding: 6px 16px; font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-secondary); font-weight: 600;
}
.sidebar-nav .nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s; font-size: 14px; color: var(--text);
}
.sidebar-nav .nav-item:hover {
  background: rgba(0,123,158,0.08);
}
.sidebar-nav .nav-item.active {
  border-left-color: var(--primary);
  background: rgba(0,123,158,0.12);
  color: var(--primary); font-weight: 600;
}
.nav-item .nav-icon { font-size: 16px; width: 22px; text-align: center; }
.nav-item .nav-progress {
  margin-left: auto; font-size: 11px; color: var(--text-secondary);
  background: var(--border); border-radius: 10px; padding: 1px 7px;
}
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-secondary); text-align: center;
}

/* MAIN CONTENT */
.main-content {
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  transition: margin-left var(--transition);
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 500;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: var(--header-height);
  display: flex; align-items: center; justify-content: space-between;
  transition: background var(--transition);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.menu-toggle {
  display: none; background: none; border: none;
  font-size: 24px; cursor: pointer; color: var(--text);
}
.header-title { font-size: 18px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 12px; cursor: pointer;
  font-size: 14px; color: var(--text); transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--primary); }

/* PROGRESS DASHBOARD */
.dashboard {
  padding: 24px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.dash-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
}
.dash-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
.dash-card .dash-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.dash-card .dash-value { font-size: 28px; font-weight: 700; color: var(--primary); }
.dash-card .dash-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.progress-bar-container {
  width: 100%; height: 8px; background: var(--border);
  border-radius: 4px; overflow: hidden; margin-top: 10px;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px; transition: width 0.5s ease;
}

/* CONTENT AREA */
.content-area { padding: 24px; max-width: 960px; }
.section { display: none; }
.section.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* PHASE CARD */
.phase-header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff; border-radius: var(--radius);
  padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden;
}
.phase-header::after {
  content: ''; position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px; background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.phase-header .phase-tag {
  display: inline-block; background: rgba(255,255,255,0.2);
  border-radius: 20px; padding: 4px 14px; font-size: 12px;
  margin-bottom: 10px; letter-spacing: 0.5px;
}
.phase-header h2 { font-size: 24px; margin-bottom: 6px; }
.phase-header p { opacity: 0.9; font-size: 14px; }

/* CARDS */
.card {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow);
  border: 1px solid var(--border); transition: background var(--transition), border var(--transition);
}
.card h3 {
  font-size: 18px; margin-bottom: 14px; color: var(--primary);
  display: flex; align-items: center; gap: 8px;
}
.card h4 { font-size: 15px; margin: 16px 0 8px; color: var(--text); }

/* OBJECTIVES / CHECKBOXES */
.objective-item, .exercise-check {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.objective-item:last-child, .exercise-check:last-child { border-bottom: none; }
.objective-item input[type="checkbox"], .exercise-check input[type="checkbox"] {
  margin-top: 3px; width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0;
}
.objective-item label, .exercise-check label { cursor: pointer; font-size: 14px; }
.objective-item.completed label { text-decoration: line-through; color: var(--text-secondary); }

/* EXERCISE */
.exercise-block {
  background: var(--bg); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
  border-left: 4px solid var(--accent);
}
.exercise-block h4 { color: var(--accent); margin-top: 0; }
.exercise-block .steps { padding-left: 20px; }
.exercise-block .steps li { margin-bottom: 8px; font-size: 14px; }
.exercise-block .tip {
  background: rgba(31,187,215,0.1); border-radius: 8px;
  padding: 10px 14px; margin-top: 12px; font-size: 13px;
  border-left: 3px solid var(--accent);
}
.exercise-block .expected {
  margin-top: 10px; font-size: 13px; color: var(--text-secondary);
  font-style: italic;
}

/* RUBRIC TABLE */
.rubric-table {
  width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px;
}
.rubric-table th, .rubric-table td {
  padding: 10px 12px; border: 1px solid var(--border); text-align: left;
}
.rubric-table th { background: var(--primary); color: #fff; font-weight: 600; }
.rubric-table tr:nth-child(even) { background: rgba(0,0,0,0.02); }
[data-theme="dark"] .rubric-table tr:nth-child(even) { background: rgba(255,255,255,0.03); }
.rubric-table input[type="number"] {
  width: 60px; padding: 4px 6px; border: 1px solid var(--border);
  border-radius: 4px; text-align: center; background: var(--bg);
  color: var(--text); font-size: 14px;
}
.grade-display {
  font-size: 32px; font-weight: 700; color: var(--primary);
  text-align: center; padding: 20px;
}

/* FORM ELEMENTS */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 4px; color: var(--text-secondary);
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px;
  transition: border 0.2s;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,123,158,0.15);
}
.form-group textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* STAR RATING */
.star-rating { display: flex; gap: 4px; }
.star-rating .star {
  font-size: 24px; cursor: pointer; color: var(--border);
  transition: color 0.2s;
}
.star-rating .star.active { color: var(--warning); }
.star-rating .star:hover { color: var(--warning); }

/* WEEK TABS */
.week-tabs {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
}
.week-tab {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg); cursor: pointer; font-size: 13px;
  transition: all 0.2s; color: var(--text);
}
.week-tab:hover { border-color: var(--primary); }
.week-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.week-tab.completed { background: var(--success); color: #fff; border-color: var(--success); }

/* DIARY */
.diary-entry {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  border-left: 4px solid var(--accent);
  position: relative;
}
.diary-entry .diary-date { font-size: 12px; color: var(--text-secondary); }
.diary-entry .diary-title { font-size: 16px; font-weight: 600; margin: 4px 0; }
.diary-entry .diary-desc { font-size: 14px; color: var(--text-secondary); }
.diary-entry .diary-mood { font-size: 20px; position: absolute; top: 16px; right: 16px; }
.diary-entry .diary-tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.diary-entry .diary-tag {
  background: rgba(0,123,158,0.1); color: var(--primary);
  padding: 2px 10px; border-radius: 12px; font-size: 12px;
}
.diary-delete {
  position: absolute; bottom: 12px; right: 12px;
  background: none; border: none; color: var(--error);
  cursor: pointer; font-size: 13px; opacity: 0.6;
}
.diary-delete:hover { opacity: 1; }

/* EMOJI PICKER */
.emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.emoji-option {
  font-size: 24px; cursor: pointer; padding: 4px;
  border-radius: 8px; border: 2px solid transparent;
  transition: all 0.2s;
}
.emoji-option:hover { background: rgba(0,0,0,0.05); }
.emoji-option.selected { border-color: var(--primary); background: rgba(0,123,158,0.1); }

/* COMPETENCY */
.competency-group { margin-bottom: 24px; }
.competency-group h4 { color: var(--primary); margin-bottom: 12px; }
.competency-item {
  display: flex; align-items: center; gap: 12px;
