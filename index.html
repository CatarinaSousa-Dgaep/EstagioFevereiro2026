<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estágio — Power BI</title>
    <style>
        /* ===== VARIÁVEIS DE TEMA ===== */
        :root {
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #1e2a47;
            --bg-sidebar: #0f1629;
            --bg-input: #253354;
            --text-primary: #e0e0e0;
            --text-secondary: #a0aec0;
            --text-heading: #f5c542;
            --accent: #f5c542;
            --accent-hover: #d4a832;
            --accent-secondary: #4fc3f7;
            --border: #2d3a5c;
            --success: #48bb78;
            --error: #fc8181;
            --warning: #f6ad55;
            --shadow: rgba(0, 0, 0, 0.4);
            --code-bg: #0d1b2a;
            --progress-bg: #2d3a5c;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-sidebar: #1a1a2e;
            --bg-input: #e2e8f0;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --text-heading: #d4a017;
            --accent: #d4a017;
            --accent-hover: #b8860b;
            --accent-secondary: #0288d1;
            --border: #e2e8f0;
            --success: #38a169;
            --error: #e53e3e;
            --warning: #dd6b20;
            --shadow: rgba(0, 0, 0, 0.1);
            --code-bg: #edf2f7;
            --progress-bg: #e2e8f0;
            --overlay: rgba(0, 0, 0, 0.5);
        }

        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            min-height: 100vh;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-height: 100vh;
            background: var(--bg-sidebar);
            padding: 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform var(--transition-speed);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-header h1 {
            color: #f5c542;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        .sidebar-nav {
            padding: 16px 0;
            flex: 1;
        }

        .nav-section-title {
            color: #718096;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 20px 6px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            gap: 12px;
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: rgba(245, 197, 66, 0.1);
            color: #f5c542;
        }

        .nav-item.active {
            background: rgba(245, 197, 66, 0.15);
            color: #f5c542;
            border-left-color: #f5c542;
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .nav-item .nav-check {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--success);
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .progress-overview {
            margin-bottom: 10px;
        }

        .progress-overview span {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #2d3a5c;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #4fc3f7);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ===== HAMBURGER MENU ===== */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: var(--accent);
            border: none;
            color: #1a1a2e;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 90;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 0;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 32px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .content-area {
            padding: 32px;
            max-width: 960px;
            margin: 0 auto;
        }
/* ===== SECTION PAGES ===== */
        .section-page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .section-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 2rem;
            color: var(--text-heading);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow);
            border-color: var(--accent);
        }

        .card h3 {
            color: var(--text-heading);
            font-size: 1.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card p, .card li {
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .card ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .card ul li {
            margin-bottom: 6px;
        }

        /* ===== INFO BOXES ===== */
        .info-box {
            border-radius: 10px;
            padding: 16px 20px;
            margin: 16px 0;
            border-left: 4px solid;
            font-size: 0.92rem;
        }

        .info-box.tip {
            background: rgba(72, 187, 120, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .info-box.warning {
            background: rgba(246, 173, 85, 0.1);
            border-color: var(--warning);
            color: var(--warning);
        }

        .info-box.note {
            background: rgba(79, 195, 247, 0.1);
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        /* ===== CODE BLOCKS ===== */
        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin: 16px 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            overflow-x: auto;
            position: relative;
            color: var(--accent-secondary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .code-block .code-label {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Segoe UI', sans-serif;
        }

        .code-block .copy-btn {
            position: absolute;
            top: 8px;
            right: 80px;
            background: var(--accent);
            color: #1a1a2e;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .code-block .copy-btn:hover {
            background: var(--accent-hover);
        }

        /* ===== GRID DE CARDS ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .stat-card .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* ===== ACCORDION ===== */
        .accordion {
            margin: 16px 0;
        }

        .accordion-item {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            background: var(--bg-card);
        }

        .accordion-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-primary);
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: rgba(245, 197, 66, 0.05);
        }

        .accordion-header .arrow {
            transition: transform 0.3s;
            color: var(--accent);
        }

        .accordion-item.open .accordion-header .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 20px;
        }

        .accordion-item.open .accordion-body {
            max-height: 2000px;
            padding: 0 20px 20px;
        }

        /* ===== QUIZ ===== */
        .quiz-container {
            margin: 20px 0;
        }

        .quiz-question {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .quiz-question h4 {
            color: var(--text-heading);
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin: 6px 0;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .quiz-option:hover {
            border-color: var(--accent);
            background: rgba(245, 197, 66, 0.1);
        }

        .quiz-option.correct {
            border-color: var(--success);
            background: rgba(72, 187, 120, 0.15);
            color: var(--success);
        }

        .quiz-option.wrong {
            border-color: var(--error);
            background: rgba(252, 129, 129, 0.15);
            color: var(--error);
        }

        .quiz-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .quiz-feedback {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
        }

        .quiz-feedback.show {
            display: block;
        }

        .quiz-feedback.correct {
            background: rgba(72, 187, 120, 0.1);
            color: var(--success);
        }

        .quiz-feedback.wrong {
            background: rgba(252, 129, 129, 0.1);
            color: var(--error);
        }

        .quiz-score {
            text-align: center;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        .quiz-score .score-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* ===== CHECKLIST ===== */
        .checklist {
            margin: 16px 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.2s;
        }

        .checklist-item:hover {
            border-color: var(--accent);
        }

        .checklist-item.checked {
            border-color: var(--success);
            background: rgba(72, 187, 120, 0.05);
        }

        .checklist-item .check-box {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        .checklist-item.checked .check-box {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .checklist-item .check-text {
            font-size: 0.92rem;
        }

        .checklist-item.checked .check-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--accent);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-reset {
            background: var(--error);
            color: white;
            font-size: 0.8rem;
            padding: 6px 14px;
        }

        /* ===== TABLE ===== */
        .styled-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem;
        }

        .styled-table th,
        .styled-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .styled-table th {
            background: var(--bg-input);
            color: var(--text-heading);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .styled-table tr:hover {
            background: rgba(245, 197, 66, 0.03);
        }

        /* ===== BADGE ===== */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-beginner {
            background: rgba(72, 187, 120, 0.15);
            color: var(--success);
        }

        .badge-intermediate {
            background: rgba(246, 173, 85, 0.15);
            color: var(--warning);
        }

        .badge-advanced {
            background: rgba(252, 129, 129, 0.15);
            color: var(--error);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .main-content {
                margin-left: 0;
            }

            .content-area {
                padding: 20px 16px;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .top-bar {
                padding: 12px 16px;
                padding-left: 68px;
            }
        }
    </style>
</head>
