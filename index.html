<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estágio — Power BI</title>
    <style>
        /* ===== VARIÁVEIS DE TEMA ===== */
        :root {
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #1e2a47;
            --bg-sidebar: #0f1629;
            --bg-input: #253354;
            --text-primary: #e0e0e0;
            --text-secondary: #a0aec0;
            --text-heading: #f5c542;
            --accent: #f5c542;
            --accent-hover: #d4a832;
            --accent-secondary: #4fc3f7;
            --border: #2d3a5c;
            --success: #48bb78;
            --error: #fc8181;
            --warning: #f6ad55;
            --shadow: rgba(0, 0, 0, 0.4);
            --code-bg: #0d1b2a;
            --progress-bg: #2d3a5c;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-sidebar: #1a1a2e;
            --bg-input: #e2e8f0;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --text-heading: #d4a017;
            --accent: #d4a017;
            --accent-hover: #b8860b;
            --accent-secondary: #0288d1;
            --border: #e2e8f0;
            --success: #38a169;
            --error: #e53e3e;
            --warning: #dd6b20;
            --shadow: rgba(0, 0, 0, 0.1);
            --code-bg: #edf2f7;
            --progress-bg: #e2e8f0;
            --overlay: rgba(0, 0, 0, 0.5);
        }

        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            min-height: 100vh;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-height: 100vh;
            background: var(--bg-sidebar);
            padding: 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform var(--transition-speed);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .sidebar-header h1 {
            color: #f5c542;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        .sidebar-nav {
            padding: 16px 0;
            flex: 1;
        }

        .nav-section-title {
            color: #718096;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 20px 6px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            gap: 12px;
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: rgba(245, 197, 66, 0.1);
            color: #f5c542;
        }

        .nav-item.active {
            background: rgba(245, 197, 66, 0.15);
            color: #f5c542;
            border-left-color: #f5c542;
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .nav-item .nav-check {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--success);
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .progress-overview {
            margin-bottom: 10px;
        }

        .progress-overview span {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #2d3a5c;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #4fc3f7);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ===== HAMBURGER MENU ===== */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: var(--accent);
            border: none;
            color: #1a1a2e;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 90;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 0;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 32px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .content-area {
            padding: 32px;
            max-width: 960px;
            margin: 0 auto;
        }
